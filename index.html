<html lang="en">

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060e0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarketDebriefs" />
    <!-- Web Push VAPID public key — used by App.jsx to subscribe users to push notifications -->
    <meta name="vapid-public-key" content="BLn7HvXfP5zzF-apLN2TFHNDhdEpxuf3cywqXBxH7dlm--sWV7YQsKbIrrl2B3ozo1rYyko5FZPeV6pqLhz2tl0" />
    <!-- Open Graph — for link previews on X, LinkedIn etc -->
    <meta property="og:title" content="MarketDebriefs — Know the macro before you trade" />
    <meta property="og:description" content="Every free calendar tells you what's on the schedule. MarketDebriefs tells you what each event means for the instrument you're trading." />
    <meta property="og:image" content="https://marketdebriefs.com/icon-512.png" />
    <meta property="og:url" content="https://marketdebriefs.com" />
    <meta property="og:type" content="website" />

    <meta name="twitter:image" content="https://marketdebriefs.com/icon-512.png" />
  <!-- Theme CSS variables — dark default, light mode on [data-theme="light"] -->
  <style>
    :root {
      --bg:       #0a0c0f;
      --bg2:      #0d1117;
      --surface1: rgba(255,255,255,.02);
      --surface2: rgba(255,255,255,.04);
      --surface3: rgba(255,255,255,.06);
      --border:   rgba(255,255,255,.08);
      --border2:  rgba(255,255,255,.12);
      --text1:    #e0e0e0;
      --text2:    #ccc;
      --text3:    #888;
      --text4:    #555;
      --text5:    #444;
      --textdim:  #333;
    }
    [data-theme="light"] {
      --bg:       #ffffff;
      --bg2:      #f8f8f8;
      --surface1: rgba(0,0,0,.03);
      --surface2: rgba(0,0,0,.05);
      --surface3: rgba(0,0,0,.08);
      --border:   rgba(0,0,0,.1);
      --border2:  rgba(0,0,0,.16);
      --text1:    #000000;
      --text2:    #000000;
      --text3:    #000000;
      --text4:    #000000;
      --text5:    #000000;
      --textdim:  #000000;
    }
    /* Force ALL text in the app to black in light mode.
       Excludes share cards (locked dark) and elements with explicit brand colours. */
    [data-theme="light"] .md-app-root,
    [data-theme="light"] .md-app-root * {
      color: #000000 !important;
    }
    /* Brand colour elements override via inline style where needed */
    /* Share cards always stay dark */
    [data-theme="light"] .share-card-capture,
    [data-theme="light"] .share-card-capture * {
      color: #e0e0e0 !important;
    }
    .share-card-capture {
      --text1: #e0e0e0 !important;
      --text2: #ccc !important;
      --text3: #888 !important;
      --text4: #555 !important;
      --text5: #444 !important;
      --textdim: #333 !important;
      --bg: #0a0c0f !important;
      --bg2: #0d1117 !important;
      --surface1: rgba(255,255,255,.02) !important;
      --surface2: rgba(255,255,255,.04) !important;
      --surface3: rgba(255,255,255,.06) !important;
      --border: rgba(255,255,255,.08) !important;
    }
    html, body { background: var(--bg); }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
